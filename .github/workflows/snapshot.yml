name: funding-snapshot

# Publishes a live Hyperliquid funding snapshot to SNAPSHOT.md.
# Runs every 6 hours (plus manual trigger). Uses the built-in
# GITHUB_TOKEN to commit back — no secrets.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Generate snapshot
        run: |
          {
            echo "# Live Hyperliquid Funding Snapshot"
            echo
            echo "Auto-generated by [hyperfund](./README.md) — refreshes every 6h. Funding is paid hourly; rates move."
            echo
            echo "_Updated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo
            echo '## Top funding edges (min OI $5M)'
            echo
            echo '```'
            ./target/release/hyperfund rates --k 8 --min-oi 5000000
            echo '```'
            echo
            echo '## Delta-neutral basket ($10k, K=5)'
            echo
            echo '```'
            ./target/release/hyperfund scan --capital 10000 --k 5 --min-oi 5000000
            echo '```'
          } > SNAPSHOT.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SNAPSHOT.md
          git diff --staged --quiet || git commit -m "chore: refresh funding snapshot [skip ci]"
          git push
